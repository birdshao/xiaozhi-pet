# S7 application stack. Run from this directory:  docker compose --env-file .env up -d --build
# Published ports: the gateway (PET_GATEWAY_BIND:PET_GATEWAY_PORT, plain HTTP, LAN only) and, with
# COMPOSE_PROFILES=ingress, the TLS ingress on 8443 (docs/V5_V6_SERVER_PLAN.md §3.3, deploy/ingress/README.md).
name: pet-server

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  pet-learning:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile.pet-learning
    image: pet-learning:s7
    user: "10001:10001"
    tmpfs: [/tmp]
    environment:
      KID_PET_ENV: production
      KID_PET_DB: /data/pet_learning.sqlite3
      KID_PET_CONTENT_DIR: /data/packages
      KID_PET_PUBLIC_ORIGIN: ${KID_PET_PUBLIC_ORIGIN:?set KID_PET_PUBLIC_ORIGIN}
      # The app trusts forwarded headers only from the gateway (fixed address below); the gateway in
      # turn trusts X-Forwarded-For only from the operator's ingress, KID_PET_TRUSTED_PROXY.
      KID_PET_TRUSTED_PROXY: 172.28.0.2
      KID_PET_TOTP_KEY: ${KID_PET_TOTP_KEY:?set KID_PET_TOTP_KEY}
      KID_PET_NOTES_KEY: ${KID_PET_NOTES_KEY:?set KID_PET_NOTES_KEY}
      # S5 voice route: only the XiaoZhi container's fixed address may call it, signed with this token.
      KID_PET_VOICE_TOKEN: ${KID_PET_VOICE_TOKEN:?set KID_PET_VOICE_TOKEN}
      KID_PET_VOICE_ALLOWED_PEERS: 172.28.0.20
    env_file:
      # S6: KID_PET_GLM_API_KEY / KID_PET_GLM_MODEL for open chat (the user keeps them in providers.env,
      # ADR-015). compose cannot pick single lines from an env_file, so this container also sees the XZ__
      # lines (ignored here) and xiaozhi-server sees the GLM key (its own chat path is off in child mode).
      - path: providers.env
        required: false
    volumes:
      - pet-data:/data
      - pet-backups:/backups
    networks:
      pet: {ipv4_address: 172.28.0.10}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8765/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # The guard calls pet-learning at its literal fixed IP (S5 refuses host names).
  xiaozhi-server:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile.xiaozhi
    image: xiaozhi-server-child:s7
    user: "10001:10001"
    networks:
      pet: {ipv4_address: 172.28.0.20}
    depends_on:
      pet-learning: {condition: service_healthy}
    tmpfs:
      - /tmp
      - /opt/xiaozhi-esp32-server/tmp:uid=10001,gid=10001
      - /opt/xiaozhi-esp32-server/config/assets/wakeup_words:uid=10001,gid=10001  # upstream mkdirs it at import
    volumes:
      - xiaozhi-data:/opt/xiaozhi-esp32-server/data
      # Local ASR model (child audio never leaves the box); fetch with deploy/fetch_models.sh
      - ./models/sherpa-onnx-paraformer-zh-small-2024-03-09:/opt/xiaozhi-esp32-server/models/sherpa-onnx-paraformer-zh-small-2024-03-09:ro
    environment:
      KID_PET_PUBLIC_ORIGIN: ${KID_PET_PUBLIC_ORIGIN}
      XZ_WEBSOCKET_URL: ${XZ_WEBSOCKET_URL:-}
      XZ_AUTH_KEY: ${XZ_AUTH_KEY:?set XZ_AUTH_KEY}
      KID_PET_CHILD_MODE: ${KID_PET_CHILD_MODE:-1}
      KID_PET_API_URL: http://172.28.0.10:8765
      KID_PET_VOICE_TOKEN: ${KID_PET_VOICE_TOKEN:?set KID_PET_VOICE_TOKEN}
      KID_PET_UPSTREAM_DEVICE_ID: ${KID_PET_UPSTREAM_DEVICE_ID:?set KID_PET_UPSTREAM_DEVICE_ID}
      KID_PET_BUSINESS_DEVICE_ID: ${KID_PET_BUSINESS_DEVICE_ID:?set KID_PET_BUSINESS_DEVICE_ID}
      XZ_ASR_MODULE: ${XZ_ASR_MODULE:-}
      XZ_LLM_MODULE: ${XZ_LLM_MODULE:-}
      XZ_TTS_MODULE: ${XZ_TTS_MODULE:-}
    env_file:
      - path: providers.env   # only provider settings: XZ__<section>__<module>__<key>=value lines
        required: false       # (kept apart from .env so the voice container never sees other secrets)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8003/xiaozhi/ota/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # One-off maintenance jobs (docker compose --profile ops run --rm --no-deps backup|cleanup), driven by
  # deploy/host/pet-maintenance.timer. The backup key lives only in the backup job, not in the service.
  backup:
    <<: *hardening
    restart: "no"
    profiles: [ops]
    image: pet-learning:s7
    user: "10001:10001"
    network_mode: none
    tmpfs: [/tmp]
    environment:
      KID_PET_BACKUP_KEY: ${KID_PET_BACKUP_KEY:?set KID_PET_BACKUP_KEY}
      KID_PET_CONTENT_DIR: /data/packages
    volumes:
      - pet-data:/data
      - pet-backups:/backups
    command: ["python", "-m", "tools.pet_learning_admin", "--db", "/data/pet_learning.sqlite3",
              "backup", "--out-dir", "/backups", "--keep", "14"]

  cleanup:
    <<: *hardening
    restart: "no"
    profiles: [ops]
    image: pet-learning:s7
    user: "10001:10001"
    network_mode: none
    tmpfs: [/tmp]
    environment:
      KID_PET_CONTENT_DIR: /data/packages
    volumes:
      - pet-data:/data
    command: ["python", "-m", "tools.pet_learning_admin", "--db", "/data/pet_learning.sqlite3", "cleanup"]

  gateway:
    <<: *hardening
    image: nginx:1.27-alpine
    cap_add: [CHOWN, SETUID, SETGID]
    depends_on:
      pet-learning: {condition: service_healthy}
    ports:
      - "${PET_GATEWAY_BIND:-127.0.0.1}:${PET_GATEWAY_PORT:-8780}:8780"
    environment:
      INGRESS_PROXY_IP: ${KID_PET_TRUSTED_PROXY:?set KID_PET_TRUSTED_PROXY}
    volumes:
      - ./nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
    networks:
      pet: {ipv4_address: 172.28.0.2}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8780/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Public TLS ingress (N1-N12). Needs deploy/ingress/install.sh to have put a certificate in
  # /etc/pet-ingress/certs first. Its fixed address is what KID_PET_TRUSTED_PROXY must be.
  ingress:
    <<: *hardening
    profiles: [ingress]
    image: nginx:1.27-alpine
    container_name: pet-ingress
    cap_add: [CHOWN, SETUID, SETGID]
    depends_on:
      gateway: {condition: service_healthy}
    ports:
      - "0.0.0.0:${PET_INGRESS_PORT:-8443}:8443"
    environment:
      PET_INGRESS_HOST: ${PET_INGRESS_HOST:-pet.birdshao.cn}
    volumes:
      - ./nginx/ingress.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/pet-ingress/certs:/etc/nginx/certs:ro
      - /var/log/pet-ingress:/var/log/nginx
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
    networks:
      pet: {ipv4_address: 172.28.0.3}
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8443"]   # an HTTPS probe by IP is refused (no SNI)
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  pet:
    ipam:
      config: [{subnet: 172.28.0.0/24}]

volumes:
  pet-data:
  pet-backups:
  xiaozhi-data:
