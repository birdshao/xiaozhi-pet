# Child-mode base for upstream's data/.config.yaml (deep-merged over upstream config.yaml).
# entrypoint.py adds server.auth_key and server.websocket from the environment, applies
# XZ_*_MODULE and XZ__* overrides, then refuses to start unless xz_checklist passes.
server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  auth:
    enabled: true            # WS requires a signed token, but at the pinned commit /xiaozhi/ota/ hands one to ANY
                             # caller (any device-id header), so this is NOT per-device pairing: keep it rate-limited
    allowed_devices: []      # whitelisted devices would skip the token check
  mqtt_gateway: null
  udp_gateway: null
read_config_from_api: false  # no manager-api => no chat-history / audio reports
delete_audio: true
enable_greeting: false       # no model-generated greeting
# S6 TTS egress audit (docs/SERVER_S6.md §3): every upstream spoken text is off or fixed in child mode.
enable_stop_tts_notify: false
enable_wakeup_words_response_cache: false
end_prompt:
  enable: false              # the no-voice timeout ends the chat silently (no model goodbye)
system_error_response: 现在还不能语音聊天，我们可以先用按键和小宠物玩。
# Texts the board sends right after a wake word (CONFIG_CUSTOM_WAKE_WORD_DISPLAY / WakeNet word).
# Listed ones are swallowed silently (enable_greeting false); anything else would go to the LLM as
# a normal utterance. Keep in step with WAKE_WORD_DISPLAY in scripts/p1_integrate.py. Lists replace
# upstream's, so 你好小智 stays for the one-step switch back.
wakeup_words:
  - "你好团团"
  - "你好小智"
selected_module:
  VAD: SileroVAD
  ASR: SherpaParaformerASR   # local, small enough for 3 GB; child audio stays on the box
  LLM: ChatGLMLLM
  VLLM: ChatGLMVLLM
  TTS: EdgeTTS
  Memory: nomem              # no XiaoZhi memory
  Intent: nointent           # the child guard owns intent
