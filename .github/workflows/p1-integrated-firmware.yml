name: P1 integrated pet ePaper firmware (app-only build)
on:
  push:
    branches: [main]
    paths:
      - 'firmware/components/kid_app/**'
      - 'scripts/p1_integrate.py'
      - 'scripts/p1_app_only_artifact.py'
      - 'scripts/p0_*'
      - 'version-lock.json'
      - '.github/workflows/p1-integrated-firmware.yml'
  pull_request:
    paths:
      - 'firmware/components/kid_app/**'
      - 'scripts/p1_integrate.py'
      - 'scripts/p1_app_only_artifact.py'
      - 'tests/test_p1_app_only_artifact.py'
      - 'tests/test_p1_integration_contract.py'
      - 'tests/test_selftest_report.py'
      - 'tests/test_prompt_audio.py'
      - 'tools/make_prompt_audio.py'
      - 'tests/test_sound_pack.py'
      - 'tools/sound_pack.py'
      - 'tools/selftest_report.py'
      - 'tools/decode_panic.py'
      - 'tests/test_decode_panic.py'
      - 'tools/selftest/**'
      - 'tests/test_p4_board_sd_overlay.py'
      - 'tests/test_p4_story_audio_contract.py'
      - 'tests/test_v4_book_reader.py'
      - 'tests/test_v4_mic_games.py'
      - 'scripts/v4_mic_tap_patch.py'
      - 'scripts/v8_mic_frame_tap_patch.py'
      - 'tests/test_v8_sound_wiring.py'
      - 'tests/test_v9_game_rules_wiring.py'
      - 'tests/test_v9_game_prompts.py'
      - 'tools/game_prompts.py'
      - 'tools/make_reader_test_book.py'
      - 'scripts/p4_audio_queue_patch.py'
      - 'scripts/p0_*'
      - 'version-lock.json'
      - '.github/workflows/p1-integrated-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile and package ESP32-S3 app only (NEVER flash)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    timeout-minutes: 50
    steps:
      - name: Checkout pet project
        uses: actions/checkout@v4
      - name: Test artifact packaging contract without hardware
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_p1_app_only_artifact.py' -v
      - name: Validate narrow EPD and Pet boot marker integration hooks
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_p1_integration_contract.py' -v
      - name: Check host self-test scenario tooling (no hardware)
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_selftest_report.py' -v
      - name: Check the panic log decoder (no hardware)
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_decode_panic.py' -v
      - name: Check embedded option prompt clips (format, rail order)
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_prompt_audio.py' -v
      - name: Check the TF sound pack tool (format, review gate, catalog)
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_sound_pack.py' -v
      - name: Check SD GPIOs and EPD story fallback before board build
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_p4_board_sd_overlay.py' -v
      - name: Validate voice-exclusive story PCM queue patch before IDF build
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_p4_story_audio_contract.py' -v
      - name: V4-05 book reader board contract and self-test scenario
        run: python3 -m unittest discover -s tests -p 'test_v4_book_reader.py' -v
      - name: V9 spoken game rules board wiring and self-test scenario
        run: python3 -m unittest discover -s tests -p 'test_v9_game_rules_wiring.py' -v
      - name: V4-08 microphone games privacy contract (loudness only) and board wiring
        run: python3 -m unittest discover -s tests -p 'test_v4_mic_games.py' -v
      - name: Clone pinned upstream and verify board config
        shell: bash
        run: bash scripts/p0_checkout.sh "$GITHUB_WORKSPACE/.upstream/xiaozhi-esp32"
      - name: Apply narrow integration patch (disposable checkout only)
        shell: bash
        run: python3 scripts/p1_integrate.py --source "$GITHUB_WORKSPACE/.upstream/xiaozhi-esp32"
      - name: Review integration diff for whitespace errors
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/.upstream/xiaozhi-esp32"
          git diff --check
      # build.py already enables ccache. Keep a cache per upstream + IDF
      # version, restoring the latest entry when this commit has no cache.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-v2-idf6.1-${{ hashFiles('version-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-v2-idf6.1-${{ hashFiles('version-lock.json') }}-
      - name: Compile official Waveshare board with Pet adapter
        shell: bash
        env:
          # IDF regenerates build/specs/picolibc.specs in each clean build.
          # ccache also applies compiler_check to -specs files: hash their
          # contents, since their fresh mtime otherwise invalidates every TU.
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1G
          CCACHE_COMPRESS: "1"
        run: |
          source "$IDF_PATH/export.sh"
          # Use the runtime container workspace for both ccache paths.
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          ccache --zero-stats
          cd "$GITHUB_WORKSPACE/.upstream/xiaozhi-esp32"
          python scripts/build.py waveshare/esp32-s3-epaper-3.97 --name esp32-s3-epaper-3.97
          ccache --show-stats
      - name: Validate and package immutable app-only image + SHA manifest
        shell: bash
        run: |
          UPSTREAM_COMMIT="$(git -C "$GITHUB_WORKSPACE/.upstream/xiaozhi-esp32" rev-parse HEAD)"
          python3 scripts/p1_app_only_artifact.py \
            --image "$GITHUB_WORKSPACE/.upstream/xiaozhi-esp32/build/xiaozhi.bin" \
            --out "$GITHUB_WORKSPACE/release" \
            --upstream-commit "$UPSTREAM_COMMIT" \
            --pet-commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID"
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 2
          test ! -e release/merged-binary.bin
      - name: Upload review-only OTA app artifact (not a flashing workflow)
        uses: actions/upload-artifact@v4
        with:
          name: pet-ota1-app-only-buildonly
          path: |
            release/xiaozhi-pet-esp32s3-app.bin
            release/manifest.json
          if-no-files-found: error
          retention-days: 14
      # Debug-only: decode a board panic with tools/decode_panic.py. Never
      # flashed (the board only ever gets the app-only image above).
      - name: Upload debug ELF and map (decode panics; not a flashing artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pet-ota1-elf-debug
          path: |
            .upstream/xiaozhi-esp32/build/xiaozhi.elf
            .upstream/xiaozhi-esp32/build/xiaozhi.map
          if-no-files-found: warn
          retention-days: 14
