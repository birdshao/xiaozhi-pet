name: Learning content pipeline contracts

on:
  pull_request:
    paths:
      - 'content_pipeline/**'
      - 'curriculum/**'
      - 'tests/test_learning_content_*.py'
      - '.github/workflows/learning-content-pipeline.yml'
  push:
    branches: [main]
    paths:
      - 'content_pipeline/**'
      - 'tests/test_learning_content_*.py'
      - '.github/workflows/learning-content-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-tests:
    name: LCIR1 + KPB2/KPG1 Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing KPB2 packaging dependencies
        run: python -m pip install -r tools/story_pack_requirements.txt
      - name: Compile LCIR1 modules
        run: python -m compileall -q content_pipeline
      - name: Test offline imports, KPB2, KPG1 and local course index
        run: |
          python -m unittest discover -s tests -p 'test_learning_content_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_learning_content_packaging.py' -v
          python -m unittest discover -s tests -p 'test_learning_content_games.py' -v
          python -m unittest discover -s tests -p 'test_learning_content_catalog.py' -v
