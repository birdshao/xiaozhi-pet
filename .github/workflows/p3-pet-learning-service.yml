name: P3 PetLearning Python service

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'tests/test_p3_pet_learning_api.py'
      - 'tools/pet_learning_admin.py'
      - 'integrations/xiaozhi_server/**'
      - 'scripts/p3_server_overlay.py'
      - 'tests/test_p3_xiaozhi_child_voice_guard.py'
      - 'tests/test_p4_approved_animal_quiz.py'
      - 'tests/test_p4_voice_story_reader.py'
      - 'tests/test_p4_local_playground.py'
      - 'tools/seed_sample_content.py'
      - '.github/workflows/p3-pet-learning-service.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'tests/test_p3_pet_learning_api.py'
      - 'tools/pet_learning_admin.py'
      - 'integrations/xiaozhi_server/**'
      - 'scripts/p3_server_overlay.py'
      - 'tests/test_p3_xiaozhi_child_voice_guard.py'
      - 'tests/test_p4_approved_animal_quiz.py'
      - 'tests/test_p4_voice_story_reader.py'
      - 'tests/test_p4_local_playground.py'
      - 'tools/seed_sample_content.py'
      - '.github/workflows/p3-pet-learning-service.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pet-service:
    name: SQLite, API and speech routing (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install isolated self-hosted API dependencies
        run: python -m pip install -r services/requirements.txt
      - name: Check local browser UI JavaScript syntax
        run: node --check services/pet_learning/playground/play.js
      - name: Compile service source
        run: python -m compileall -q services integrations/xiaozhi_server scripts/p3_server_overlay.py tools/pet_learning_admin.py tools/seed_sample_content.py
      - name: Run isolated service integration tests (no hardware/cloud)
        run: |
          python -m unittest discover -s tests -p 'test_p3_pet_learning_api.py' -v
          python -m unittest discover -s tests -p 'test_p3_xiaozhi_child_voice_guard.py' -v
          python -m unittest discover -s tests -p 'test_p4_approved_animal_quiz.py' -v
          python -m unittest discover -s tests -p 'test_p4_voice_story_reader.py' -v
          python -m unittest discover -s tests -p 'test_p4_local_playground.py' -v
