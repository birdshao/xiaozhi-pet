name: P2 deterministic pet state machine

on:
  pull_request:
    paths:
      - 'firmware/components/kid_app/**'
      - 'tests/cpp/test_parrot_session.cc'
      - 'tests/cpp/test_song_player.cc'
      - 'tests/cpp/test_routine_timer.cc'
      - 'tests/cpp/test_sound_view.cc'
      - 'tests/cpp/test_pet_controller.cc'
      - 'tests/cpp/test_sound_pack.cc'
      - 'tools/sound_pack.py'
      - 'tools/make_prompt_audio.py'
      - 'tests/cpp/test_mini_game.cc'
      - 'tests/cpp/test_mic_games.cc'
      - 'tests/cpp/test_play_games.cc'
      - 'tests/cpp/test_game_pack_reader.cc'
      - 'tests/fixtures/kpg1/**'
      - 'tests/cpp/test_memory_golden.cc'
      - 'tests/fixtures/memory/**'
      - 'tests/cpp/test_server_sync.cc'
      - 'tests/fixtures/sync/**'
      - 'tests/fixtures/ledger/**'
      - 'tests/cpp/test_care.cc'
      - 'tests/cpp/test_care_ledger.cc'
      - 'tools/care_phrases.py'
      - 'tests/test_v8_care_phrases.py'
      - 'tests/cpp/test_game_rules.cc'
      - 'tests/cpp/test_game_rule_clips.cc'
      - 'tools/game_prompts.py'
      - 'tests/test_v9_game_prompts.py'
      - 'tests/cpp/test_care_v9.cc'
      - 'tests/test_v9_care_phrases.py'
      - 'scripts/p2_test.sh'
      - '.github/workflows/p2-pet-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pet-engine-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute deterministic C++ tests
        run: bash scripts/p2_test.sh
      - name: V8 care lines (review checklist, TTS drafts, sound pack catalog)
        run: python3 -m unittest discover -s tests -p 'test_v8_care_phrases.py' -v
      - name: V9 spoken game rules (wording, ids, review list, sound pack catalog)
        run: python3 -m unittest discover -s tests -p 'test_v9_game_prompts.py' -v
      - name: V9 care lines (drafts flagged for adult audition)
        run: python3 -m unittest discover -s tests -p 'test_v9_care_phrases.py' -v
