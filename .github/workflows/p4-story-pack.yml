name: P4 offline SD story packages

on:
  pull_request:
    paths:
      - 'tools/make_branch_test_book.py'
      - 'tools/tuantuan_series.py'
      - 'curriculum/stories/**'
      - 'tests/test_v8_books.py'
      - 'tests/cpp/test_branch_book.cc'
      - 'docs/V8_BOOKS.md'
      - 'docs/V8_STORY_REVIEW.md'
      - 'tools/story_pack.py'
      - 'tools/make_story_sd_fixture.py'
      - 'tools/story_pack_requirements.txt'
      - 'tools/kpb2.py'
      - 'tests/test_v4_kpb2.py'
      - 'tests/fixtures/kpb2/**'
      - 'tests/cpp/test_content_pack_reader.cc'
      - 'tools/make_reader_test_book.py'
      - 'tests/test_v4_book_reader.py'
      - 'firmware/components/kid_app/**'
      - 'tests/test_p4_story_pack.py'
      - 'tests/test_p4_story_sd_smoke_fixture.py'
      - 'tests/cpp/test_story_pack_reader.cc'
      - 'docs/P4_OFFLINE_STORY_PACK.md'
      - 'docs/V4_KPB2_CONTENT_FORMAT.md'
      - 'tools/game_pack.py'
      - 'tests/test_v4_game_pack.py'
      - 'tools/v8_quiz_content.py'
      - 'tests/test_v8_quiz_content.py'
      - 'docs/V8_QUIZ_REVIEW_CHECKLIST.md'
      - 'tests/fixtures/kpg1/**'
      - '.github/workflows/p4-story-pack.yml'
  push:
    branches: [main]
    paths:
      - 'tools/make_branch_test_book.py'
      - 'tools/tuantuan_series.py'
      - 'curriculum/stories/**'
      - 'tests/test_v8_books.py'
      - 'tests/cpp/test_branch_book.cc'
      - 'docs/V8_BOOKS.md'
      - 'docs/V8_STORY_REVIEW.md'
      - 'tools/story_pack.py'
      - 'tools/make_story_sd_fixture.py'
      - 'tools/story_pack_requirements.txt'
      - 'tools/kpb2.py'
      - 'tests/test_v4_kpb2.py'
      - 'tests/fixtures/kpb2/**'
      - 'tests/cpp/test_content_pack_reader.cc'
      - 'tools/make_reader_test_book.py'
      - 'tests/test_v4_book_reader.py'
      - 'firmware/components/kid_app/**'
      - 'tests/test_p4_story_pack.py'
      - 'tests/test_p4_story_sd_smoke_fixture.py'
      - 'tests/cpp/test_story_pack_reader.cc'
      - 'tools/game_pack.py'
      - 'tests/test_v4_game_pack.py'
      - 'tools/v8_quiz_content.py'
      - 'tests/test_v8_quiz_content.py'
      - 'docs/V8_QUIZ_REVIEW_CHECKLIST.md'
      - 'tests/fixtures/kpg1/**'
      - '.github/workflows/p4-story-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story:
    name: Python ${{ matrix.python-version }}; C++ 17 SD reader
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r tools/story_pack_requirements.txt
      - name: Check Python and offline pack CLI
        run: python -m compileall -q tools/story_pack.py tools/kpb2.py tools/game_pack.py
      - name: Generate reviewed fixtures and validate on compiled device reader
        run: python -m unittest discover -s tests -p 'test_p4_story_pack.py' -v
      - name: KPB2 grey pages and choice questions; golden packs; compiled C++ reader
        run: python -m unittest discover -s tests -p 'test_v4_kpb2.py' -v
      - name: V8 branching books, bedtime story contract, TuanTuan series (draft, offline)
        run: python -m unittest discover -s tests -p 'test_v8_books.py' -v
      - name: V4-05 reader test book, board reader contract and self-test scenario
        run: python -m unittest discover -s tests -p 'test_v4_book_reader.py' -v
      - name: KPG1 mini-game packs (V4-06); golden pack; shared art and clip ids
        run: python -m unittest discover -s tests -p 'test_v4_game_pack.py' -v
      - name: V8 voice-kind quiz banks (20+ rounds), packs compile, review checklist in sync
        run: python -m unittest discover -s tests -p 'test_v8_quiz_content.py' -v
      - name: Check distinct page graphics and test tones in SD smoke fixture
        run: python -m unittest discover -s tests -p 'test_p4_story_sd_smoke_fixture.py' -v
      - name: Generate downloadable TF card diagnostic book
        if: matrix.python-version == '3.12'
        run: python -m tools.make_story_sd_fixture --output build/story-smoke
      - name: Generate V4-05 reader test book (not child content)
        if: matrix.python-version == '3.12'
        run: python -m tools.make_reader_test_book --output build/reader-test
      - name: Upload V4-05 reader test book (not child content)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-tf-reader-test-only
          path: |
            build/reader-test/books/reader_test.kpb
            build/reader-test/README-READER-TEST-ONLY.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload TF card diagnostic book (not child content)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-tf-story-smoke-only
          path: |
            build/story-smoke/books/forest_friends.kpb
            build/story-smoke/README-SMOKE-ONLY.txt
          if-no-files-found: error
          retention-days: 14
